# Build the app and publish it to GitHub Pages on every push to main.
#
# Accounts are optional: set the repository VARIABLES (not secrets — the
# Supabase anon/publishable key is public by design) SUPABASE_URL and
# SUPABASE_ANON_KEY to turn on sign-in and cloud saves. Without them the
# site still deploys and saves to the browser only.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (served from /<repo-name>/)
        run: npm run build --workspace=app -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
